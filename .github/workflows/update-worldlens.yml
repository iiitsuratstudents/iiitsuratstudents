name: Update WorldLens

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/update-worldlens.mjs"
      - ".github/workflows/update-worldlens.yml"
  schedule:
    # Refresh six times per day, away from the top of the hour.
    - cron: "23 */4 * * *"

permissions:
  contents: write

concurrency:
  group: worldlens-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Generate current WorldLens briefs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
        run: node scripts/update-worldlens.mjs

      - name: Commit refreshed brief
        run: |
          git config user.name "SETU WorldLens Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/worldlens.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Refresh WorldLens [skip ci]"
          git push
