name: Update WorldLens

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/update-worldlens.mjs"
      - ".github/workflows/update-worldlens.yml"
  schedule:
    # Refresh six times per day, away from the top of the hour.
    - cron: "23 */4 * * *"

permissions:
  contents: write

concurrency:
  group: worldlens-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Cache local LLM
        uses: actions/cache@v6
        with:
          path: ~/.ollama/models
          key: ollama-qwen3-1.7b-v1

      - name: Start local Qwen model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ollama"
          docker pull ollama/ollama:latest
          docker run -d             --name setu-ollama             -v "$HOME/.ollama:/root/.ollama"             -p 11434:11434             ollama/ollama:latest

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          docker exec setu-ollama ollama pull qwen3:1.7b
          echo "Local model ready."

      - name: Generate current WorldLens briefs
        env:
          LLM_PROVIDER: ollama
          OLLAMA_MODEL: qwen3:1.7b
        run: node scripts/update-worldlens.mjs

      - name: Commit refreshed brief
        run: |
          git config user.name "SETU WorldLens Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/worldlens.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Refresh WorldLens [skip ci]"
          git push
